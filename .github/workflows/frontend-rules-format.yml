name: Frontend Rules Format

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'docs/frontend-code-rules-ai-native'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: yakable-ui/package-lock.json

      - name: Format frontend rule docs
        working-directory: yakable-ui
        run: |
          npm ci
          npm run format

      - name: Commit formatted rule docs
        run: |
          if git diff --quiet; then
            echo "Frontend rule docs are already formatted."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yakable-ui/src/features/FEATURE_RULES.md                   yakable-ui/src/shared/lib/LIB_RULES.md                   yakable-ui/src/shared/ui/UI_RULES.md
          git commit -m "style: format frontend rule docs"
          git push origin HEAD:${{ github.head_ref }}
