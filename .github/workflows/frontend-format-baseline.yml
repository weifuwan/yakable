name: Frontend Format Baseline

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'fix/frontend-ci-baseline'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: yakable-ui/package-lock.json

      - name: Format frontend
        working-directory: yakable-ui
        run: |
          npm ci
          npm run format

      - name: Commit formatted baseline
        run: |
          if git diff --quiet; then
            echo "Frontend is already formatted."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yakable-ui/src yakable-ui/vite.config.ts yakable-ui/vitest.config.ts
          git commit -m "style: format frontend baseline"
          git push origin HEAD:${{ github.head_ref }}
