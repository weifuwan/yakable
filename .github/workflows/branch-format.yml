name: Branch Format

on:
  push:
    branches:
      - feat/turn-navigator-turn-render-boundary

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.event.head_commit.message != 'style: apply oxfmt' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feat/turn-navigator-turn-render-boundary

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: yakable-ui/package-lock.json

      - name: Install dependencies
        working-directory: yakable-ui
        run: npm ci

      - name: Format frontend
        working-directory: yakable-ui
        run: npm run format

      - name: Commit formatted files
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yakable-ui/src
          git commit -m "style: apply oxfmt"
          git push
