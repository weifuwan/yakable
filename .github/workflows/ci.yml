name: Yakable CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yakable-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Docker
        run: docker version

      - name: Verify backend
        run: ./mvnw -B -ntp verify

  frontend:
    name: Frontend Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: yakable-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: yakable-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Build frontend
        run: npm run build

  quality-gate:
    name: Yakable / Quality Gate
    if: always()
    needs:
      - backend
      - frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Verify upstream results
        shell: bash
        run: |
          echo "Backend Verification: ${{ needs.backend.result }}"
          echo "Frontend Verification: ${{ needs.frontend.result }}"

          if [[ "${{ needs.backend.result }}" != "success" ]]; then
            echo "Backend Verification did not succeed."
            exit 1
          fi

          if [[ "${{ needs.frontend.result }}" != "success" ]]; then
            echo "Frontend Verification did not succeed."
            exit 1
          fi
