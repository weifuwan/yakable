spring:
  application:
    name: yakable
  datasource:
    url: ${YAKABLE_DB_URL:jdbc:mysql://127.0.0.1:3306/yakable?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${YAKABLE_DB_USERNAME:root}
    password: ${YAKABLE_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  mvc:
    async:
      request-timeout: ${YAKABLE_SSE_TIMEOUT:10m}

yakable:
  sse:
    timeout: ${YAKABLE_SSE_TIMEOUT:10m}
  turn-execution:
    recovery-interval: 5s
    running-timeout: 10m
    max-concurrent: ${YAKABLE_TURN_MAX_CONCURRENT:16}
    max-concurrent-per-user: ${YAKABLE_TURN_MAX_CONCURRENT_PER_USER:2}
  session:
    context:
      max-history-turns: ${YAKABLE_CONTEXT_MAX_HISTORY_TURNS:20}
  auth:
    session-ttl-seconds: ${YAKABLE_AUTH_SESSION_TTL_SECONDS:604800}
    initial-admin:
      username: ${YAKABLE_ADMIN_USERNAME:}
      name: ${YAKABLE_ADMIN_NAME:}
      password: ${YAKABLE_ADMIN_PASSWORD:}
  model:
    providers:
      deepseek:
        api-key: ${DEEPSEEK_API_KEY:}
        base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}

management:
  endpoints:
    web:
      exposure:
        include: health
