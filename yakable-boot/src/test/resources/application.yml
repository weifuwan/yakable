spring:
  application:
    name: yakable-test
  datasource:
    url: jdbc:h2:mem:yakable-boot;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;LOCK_TIMEOUT=10000
    username: sa
    password:
    driver-class-name: org.h2.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

yakable:
  turn-execution:
    recovery-enabled: false
